name: linkdrop
description: AirDrop-style local Wi-Fi file transfer — CLI engine + Flutter GUI
# The version that actually ships. The git tag only decides *when* a release
# is built — release.yml refuses to publish if `v<version>` and this disagree.
# Bump this, commit, then tag. See docs/RELEASING.md.
#
# The `+N` build number becomes Android's versionCode and must increase on
# every release, or Android refuses the upgrade.
version: 0.1.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  cupertino_icons: ^1.0.8
  file_picker: 10.3.10
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  basic_utils: ^5.8.2
  pointycastle: ^4.0.0
  # Reads the *installed* package's version, which is what the update check
  # has to compare against (Decision 020). A compiled-in constant would drift
  # from what the user actually has.
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
