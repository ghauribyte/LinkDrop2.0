name: Release

# Pushing an annotated tag is the entire release command:
#
#   git tag -a v0.2.0 && git push origin v0.2.0
#
# See docs/RELEASING.md for the full procedure.
on:
  push:
    tags: ['v*']

# Without this, --publish 403s at the very end of a successful build.
permissions:
  contents: write

jobs:
  # Runs first and takes seconds. electron-builder-style pipelines take the
  # version from the manifest and let the tag decide only *when* to build, so
  # a mismatch ships assets whose filenames lie about their contents and the
  # update check compares the wrong numbers. Catch it before burning minutes.
  version-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: pubspec version must match the tag
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: *//p' LinkDrop/pubspec.yaml | cut -d'+' -f1)"
          tag="${GITHUB_REF_NAME}"
          echo "pubspec: $version   tag: $tag"
          if [ "v$version" != "$tag" ]; then
            echo "::error::pubspec.yaml says $version but the tag is $tag. Fix pubspec.yaml, delete the tag, and re-tag."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  checks:
    uses: ./.github/workflows/checks.yml

  android:
    needs: [version-guard, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: LinkDrop
    env:
      VERSION: ${{ needs.version-guard.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See docs/RELEASING.md."
            exit 1
          fi
          # Written outside the repo so it can never be picked up by a build
          # that packages the working tree.
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the APK
        env:
          LINKDROP_KEYSTORE: ${{ runner.temp }}/release.jks
          LINKDROP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LINKDROP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LINKDROP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release

      # build.gradle.kts silently falls back to debug signing when the
      # keystore or any of its passwords are missing — deliberately, so a
      # fresh clone can still build. That fallback must never reach a user:
      # a debug-signed APK is signed with a key everyone has, and cannot be
      # upgraded in place by a properly signed build later. So assert it
      # rather than assume the env vars arrived.
      - name: Refuse a debug-signed APK
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee /tmp/certs.txt
          if grep -q "CN=Android Debug" /tmp/certs.txt; then
            echo "::error::The APK is debug-signed — the release keystore was not picked up."
            exit 1
          fi

      - name: Name the artifact
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/linkdrop-${VERSION}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: LinkDrop/build/app/outputs/flutter-apk/linkdrop-${{ env.VERSION }}-android.apk
          if-no-files-found: error

  linux:
    needs: [version-guard, checks]
    # Deliberately not ubuntu-latest: the resulting binary links against the
    # builder's glibc, so building on the oldest supported runner is what
    # makes the tarball usable on more than the newest distributions.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: LinkDrop
    env:
      VERSION: ${{ needs.version-guard.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Build the bundle
        run: |
          flutter pub get
          flutter build linux --release

      # Archived from inside bundle/ so it unpacks as a self-contained folder
      # rather than scattering data/ and lib/ into the current directory.
      - name: Pack the tarball
        run: |
          set -euo pipefail
          tar -czf "linkdrop-${VERSION}-linux-x64.tar.gz" \
            -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: LinkDrop/linkdrop-${{ env.VERSION }}-linux-x64.tar.gz
          if-no-files-found: error

  publish:
    needs: [version-guard, android, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version-guard.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Needed for the annotated tag's message, which is the release notes —
      # this project keeps no CHANGELOG file.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect the release notes from the tag
        run: |
          set -euo pipefail
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          if [ ! -s notes.md ]; then
            printf 'LinkDrop %s\n' "$VERSION" > notes.md
          fi
          cat notes.md

      # The manifest the installed app reads, and the one asset that is easy
      # to forget: without it, every running copy asking "is there a newer
      # version?" gets no answer. Built with jq rather than string
      # interpolation so the notes are escaped correctly by construction.
      - name: Generate latest.json
        run: |
          set -euo pipefail
          base="${{ github.server_url }}/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$GITHUB_REF_NAME" \
            --rawfile notes notes.md \
            --arg android "$base/linkdrop-${VERSION}-android.apk" \
            --arg linux "$base/linkdrop-${VERSION}-linux-x64.tar.gz" \
            '{version: $version, tag: $tag, notes: $notes,
              android_url: $android, linux_url: $linux}' > dist/latest.json
          cat dist/latest.json

      - name: Publish the release
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "LinkDrop $VERSION" \
            --notes-file notes.md \
            dist/*

      # A release missing an asset looks fine on GitHub and silently breaks
      # every client's update check, so say so here rather than finding out
      # from a user.
      - name: Confirm all three assets landed
        run: |
          set -euo pipefail
          names="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[].name] | join(" ")')"
          echo "assets: $names"
          for want in "linkdrop-${VERSION}-android.apk" "linkdrop-${VERSION}-linux-x64.tar.gz" "latest.json"; do
            case " $names " in
              *" $want "*) ;;
              *) echo "::error::missing asset: $want"; exit 1 ;;
            esac
          done
